# Usado quando o plugin estiver no próprio repositório (no monorepo, o CI da raiz cobre o plugin).
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
